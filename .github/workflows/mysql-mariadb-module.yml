name: module-cleaner Real Host Module Matrix

on:
  push:
    branches: [claude/funny-hawking-module-cleaner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - connection: mysql
            image: mysql:8.4
          - connection: mariadb
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codex_flt018_module_cleaner_${{ github.run_id }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: module-source
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: codex_flt018_module_cleaner_${{ github.run_id }}
      DB_USERNAME: root
      DB_PASSWORD: root
      LONGLINK_TEST_AUTOLOAD: ${{ github.workspace }}/host-source/portal/vendor/autoload.php
    steps:
      - uses: actions/checkout@v4
        with:
          path: module-source
          persist-credentials: false
      - name: Require read-only host checkout credential
        env:
          HOST_READ_TOKEN: ${{ secrets.LONGLINK_HOST_READ_TOKEN }}
        run: |
          test -n "$HOST_READ_TOKEN" || { echo "::error::Configure LONGLINK_HOST_READ_TOKEN with read-only contents access to tichm30/longlink-erp."; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: tichm30/longlink-erp
          ref: claude/funny-hawking-FexoS
          path: host-source
          token: ${{ secrets.LONGLINK_HOST_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, fileinfo, intl, mbstring, pdo_mysql, xml, zip
          coverage: none
      - name: Install real host dependencies
        working-directory: host-source/portal
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Package once for outer ZIP checks
        run: bash packaging/build-module-zip.sh
      - name: Collect module checks with real host services
        run: php tests/run-module-tests.php
